<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>えんつむ公式LINE</title>
  <meta name="robots" content="noindex">
  <!-- Threadsなどでリンクを貼った時のカード表示 -->
  <meta property="og:title" content="えんつむ公式LINE｜コピペで使える頼み方集">
  <meta property="og:description" content="LINEで「頼み方」と送ると、そのまま貼れるAIへの頼み方集が届きます。">
  <meta property="og:image" content="https://entool-lp-80z.pages.dev/ogp.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 2026-10-19: noteなどから公式LINEへ送るための転送ページ(/brain と同じ作り)。
       lin.ee のリンクには来た場所を付けられないため、ここを通った人数をGA4の click_line_redirect で数えてからLINEへ移る。
       ?from=note1 のように付けると、event_label に入れて入口ごとに区別できる -->
  <noscript><meta http-equiv="refresh" content="0;url=https://lin.ee/G4Gw7kT"></noscript>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HL6L4LDXVD"></script>
  <script>
    var LINE_URL = 'https://lin.ee/G4Gw7kT';
    var moved = false;
    function goLine() { if (moved) return; moved = true; location.replace(LINE_URL); }

    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ window.dataLayer.push(arguments); }
    window.gtag('js', new Date());
    // 自分の確認アクセスを数えない(index.htmlと同じ仕組み): ?internal=1 で一度開いた端末は以後GA4へ送らない
    var internal = false;
    try {
      var params = new URLSearchParams(location.search);
      if (params.get('internal') === '1') localStorage.setItem('entsumu_internal', '1');
      if (params.get('internal') === '0') localStorage.removeItem('entsumu_internal');
      internal = localStorage.getItem('entsumu_internal') === '1';
      if (internal) window['ga-disable-G-HL6L4LDXVD'] = true;
    } catch (e) {}
    // page_viewは送らない（LP訪問者数に転送ページの通過を混ぜないため。数えるのは click_line_redirect だけ）
    window.gtag('config', 'G-HL6L4LDXVD', { send_page_view: false });

    var from = 'unknown';
    try { from = new URLSearchParams(location.search).get('from') || 'unknown'; } catch (e) {}

    if (internal) {
      goLine();
    } else {
      window.gtag('event', 'click_line_redirect', {
        event_category: 'conversion',
        event_label: from,
        transport_type: 'beacon',
        event_callback: goLine
      });
      // GA4の読み込みが遅い・ブロックされている時も、待たせずに移動する
      setTimeout(goLine, 1200);
    }
  </script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; text-align: center; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <p>えんつむ公式LINEへ移動しています…<br>
  自動で移動しない場合は<a href="https://lin.ee/G4Gw7kT">こちら</a>を開いてください。</p>
</body>
</html>
